services:
  api:
    build: .
    image: velos-api:1.0
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - velos-interne

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - donnees-velos:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - velos-interne

volumes:
  donnees-velos:

networks:
  velos-interne:
    internal: true
